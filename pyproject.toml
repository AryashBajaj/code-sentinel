[project]
name = "code-sentinel"
version = "0.1.0"
description = "AI-powered code analysis tool for security and optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "toml>=0.10.0",
    "tree-sitter>=0.21.0,<0.22.0",
    "tree-sitter-languages>=1.9.0,<1.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.analyzer", "src.callgraph", "src.config", "src.report", "src.scanner", "src.analyzer.tree_sitter", "src.analyzer.llm", "src.analyzer.rules", "src.analyzer.framework"]

[tool.ruff]
line-length = 100
target-version = "py310"

[project.scripts]
code-sentinel = "src.cli:main"
